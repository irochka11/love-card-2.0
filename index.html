<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для тебя ❤️</title>
    <!-- Подключаем красивые современные шрифты Montserrat и JetBrains Mono -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=JetBrains+Mono:wght@700&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #ffe6e6;
            /* Новый стильный шрифт для интерфейса */
            font-family: 'Montserrat', sans-serif; 
            overflow: hidden;
            margin: 0;
            transition: background-color 0.8s ease-out;
        }
        
        h1 { 
            color: #ff4d4d; 
            font-size: 2.5rem; 
            text-align: center; 
            z-index: 10; 
            user-select: none;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        /* Контейнер для кнопок, обеспечивающий их правильное начальное отображение */
        .buttons-container {
            position: relative;
            width: 100%;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            z-index: 10;
        }

        button {
            padding: 15px 35px;
            font-size: 1.1rem;
            font-family: 'Montserrat', sans-serif;
            font-weight: 500;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            user-select: none;
        }

        #yesBtn { 
            background-color: #ff4d4d; 
            color: white; 
            transition: transform 0.2s, background-color 0.2s;
        }
        #yesBtn:hover {
            transform: scale(1.05);
            background-color: #ff3333;
        }

        /* Кнопка "Нет" теперь изначально стоит в потоке рядом с "Да" */
        #noBtn { 
            background-color: #9b9b9b; 
            color: white; 
            transition: transform 0.1s ease;
        }
        
        /* Новый дизайнерский контейнер для фейерверк-сердца */
        #heartContainer {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.01);
            text-align: left; 
            /* Новый четкий и модный моноширинный шрифт */
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-weight: 700;
            font-size: 13px;
            line-height: 1.3;
            color: #ff3366;
            text-shadow: 0 0 10px #ff3366, 0 0 25px #ff0044, 0 0 50px #ff0044;
            white-space: pre;
            z-index: 1;
            user-select: none;
            opacity: 0;
            letter-spacing: -0.5px;
        }

        @keyframes slowFloat {
            0% { transform: translate(-50%, -50%) scale(1); text-shadow: 0 0 10px #ff3366, 0 0 25px #ff0044; }
            50% { transform: translate(-50%, -50%) scale(1.03); text-shadow: 0 0 15px #ff3366, 0 0 35px #ff0044; }
            100% { transform: translate(-50%, -50%) scale(1); text-shadow: 0 0 10px #ff3366, 0 0 25px #ff0044; }
        }
    </style>
</head>
<body>

    <h1 id="question">Ты меня любишь? 🥺</h1>
    
    <div class="buttons-container" id="toolsArea">
        <button id="yesBtn">Да!</button>
        <button id="noBtn">Нет</button>
    </div>

    <div id="heartContainer"></div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const question = document.getElementById('question');
        const heartContainer = document.getElementById('heartContainer');
        const toolsArea = document.getElementById('toolsArea');

        const music = new Audio('music.mp3');
        music.loop = true;

        // Функция перемещения кнопки. При первом нажатии она переходит в режим абсолютного позиционирования
        function moveButton(e) {
            if (e) e.preventDefault(); // Защита от стандартных кликов на смартфонах
            
            noBtn.style.position = 'absolute';
            
            // Вычисляем случайные координаты по всему экрану
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
            
            noBtn.style.left = `${x}px`;
            noBtn.style.top = `${y}px`;
        }

        // Изменено: теперь триггер срабатывает только на клик/таinitial нажатие, а не на наведение мыши
        noBtn.addEventListener('click', moveButton);
        noBtn.addEventListener('touchstart', moveButton, {passive: false});

        const heartTemplate = 
            "      love you love             love you love      \n" +
            "    love you love you          love you love you    \n" +
            "  love you love you love    love you love you love  \n" +
            " love you love you love you love you love you love y \n" +
            "love you love you love you love you love you love yo \n" +
            " love you love you love you love you love you love y \n" +
            "  love you love you love you love you love you love  \n" +
            "    love you love you love you love you love you    \n" +
            "      love you love you love you love you love      \n" +
            "        love you love you love you love you        \n" +
            "          love you love you love you love          \n" +
            "            love you love you love you            \n" +
            "              love you love you love              \n" +
            "                love you love you                \n" +
            "                  love you love                  \n" +
            "                    love you                    \n" +
            "                      love                      \n" +
            "                       v                        \n";

        function startHeartAnimation() {
            document.body.style.backgroundColor = '#050006';
            heartContainer.innerText = heartTemplate;
            heartContainer.style.display = 'block';

            let progress = 0; 
            
            function animate() {
                if (progress < 1) {
                    progress += 0.0025; // Сверхмедленное раскрытие фейерверка
                    let easeProgress = 1 - Math.pow(1 - progress, 4); 
                    
                    let currentScale = 0.01 + (0.99 * easeProgress);
                    let currentOpacity = easeProgress;

                    heartContainer.style.transform = `translate(-50%, -50%) scale(${currentScale})`;
                    heartContainer.style.opacity = currentOpacity;
                    
                    requestAnimationFrame(animate);
                } else {
                    heartContainer.style.animation = 'slowFloat 6s ease-in-out infinite';
                }
            }
            animate();
        }

        function playWithFallback() {
            music.volume = 1.0;
            music.play().catch(e => {
                const forceUnlock = () => {
                    music.play();
                    document.removeEventListener('click', forceUnlock);
                    document.removeEventListener('touchstart', forceUnlock);
                };
                document.addEventListener('click', forceUnlock);
                document.addEventListener('touchstart', forceUnlock);
            });
        }

        yesBtn.addEventListener('click', () => {
            question.style.display = 'none';
            toolsArea.style.display = 'none'; // Прячем весь контейнер с кнопками разом
            
            startHeartAnimation();
            playWithFallback();
        });
    </script>
</body>
</html>
