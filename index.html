<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для тебя ❤️</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #ffe6e6;
            font-family: 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            margin: 0;
            transition: background-color 0.8s ease-out;
        }
        h1 { color: #ff4d4d; font-size: 2.5rem; text-align: center; z-index: 10; user-select: none; }
        .buttons { display: flex; gap: 20px; margin-top: 20px; position: relative; z-index: 10; width: 300px; height: 60px; justify-content: center; align-items: center; }
        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            user-select: none;
        }
        #yesBtn { background-color: #ff4d4d; color: white; z-index: 11; }
        #noBtn { background-color: #808080; color: white; position: absolute; }
        
        /* Исправленный контейнер для идеальной геометрии */
        #heartContainer {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.01);
            /* СТРОГО ВЛЕВО, чтобы пробелы не ломали рисунок */
            text-align: left; 
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 14px;
            line-height: 1.3;
            color: #ff3366;
            text-shadow: 0 0 8px #ff3366, 0 0 20px #ff0044, 0 0 40px #ff0044;
            white-space: pre;
            z-index: 1;
            user-select: none;
            opacity: 0;
        }

        @keyframes slowFloat {
            0% { transform: translate(-50%, -50%) scale(1); text-shadow: 0 0 10px #ff3366, 0 0 25px #ff0044; }
            50% { transform: translate(-50%, -50%) scale(1.03); text-shadow: 0 0 15px #ff3366, 0 0 35px #ff0044; }
            100% { transform: translate(-50%, -50%) scale(1); text-shadow: 0 0 10px #ff3366, 0 0 25px #ff0044; }
        }
    </style>
</head>
<body>

    <h1 id="question">Ты меня любишь? 🥺</h1>
    <div class="buttons">
        <button id="yesBtn">Да!</button>
        <button id="noBtn">Нет</button>
    </div>

    <div id="heartContainer"></div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const question = document.getElementById('question');
        const heartContainer = document.getElementById('heartContainer');

        const music = new Audio('music.mp3');
        music.loop = true;

        function moveButton() {
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
            noBtn.style.left = `${x}px`;
            noBtn.style.top = `${y}px`;
        }

        noBtn.addEventListener('mouseover', moveButton);
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            moveButton();
        });

        // ИДЕАЛЬНО ВЫРОВНЕННЫЙ ШАБЛОН СЕРДЦА
        const heartTemplate = 
            "      love you love             love you love      \n" +
            "    love you love you          love you love you    \n" +
            "  love you love you love    love you love you love  \n" +
            " love you love you love you love you love you love yo\n" +
            "love you love you love you love you love you love you\n" +
            " love you love you love you love you love you love yo\n" +
            "  love you love you love you love you love you love  \n" +
            "    love you love you love you love you love you    \n" +
            "      love you love you love you love you love      \n" +
            "        love you love you love you love you        \n" +
            "          love you love you love you love          \n" +
            "            love you love you love you            \n" +
            "              love you love you love              \n" +
            "                love you love you                \n" +
            "                  love you love                  \n" +
            "                    love you                    \n" +
            "                      love                      \n" +
            "                       v                        \n";

        function startHeartAnimation() {
            document.body.style.backgroundColor = '#050006';
            heartContainer.innerText = heartTemplate;
            heartContainer.style.display = 'block';

            let progress = 0; 
            
            function animate() {
                if (progress < 1) {
                    progress += 0.0025; // Скорость раскрытия (очень медленная)
                    let easeProgress = 1 - Math.pow(1 - progress, 4); 
                    
                    let currentScale = 0.01 + (0.99 * easeProgress);
                    let currentOpacity = easeProgress;

                    heartContainer.style.transform = `translate(-50%, -50%) scale(${currentScale})`;
                    heartContainer.style.opacity = currentOpacity;
                    
                    requestAnimationFrame(animate);
                } else {
                    heartContainer.style.animation = 'slowFloat 6s ease-in-out infinite';
                }
            }
            animate();
        }

        function playWithFallback() {
            music.volume = 1.0;
            music.play().catch(e => {
                const forceUnlock = () => {
                    music.play();
                    document.removeEventListener('click', forceUnlock);
                    document.removeEventListener('touchstart', forceUnlock);
                };
                document.addEventListener('click', forceUnlock);
                document.addEventListener('touchstart', forceUnlock);
            });
        }

        yesBtn.addEventListener('click', () => {
            question.style.display = 'none';
            document.querySelector('.buttons').style.display = 'none';
            
            startHeartAnimation();
            playWithFallback();
        });
    </script>
</body>
</html>
